[project]
name = "nsclc-missing-omics-sensitivity"
version = "0.1.0"
description = "Sensitivity analysis of pathway discovery to missing omics patterns in NSCLC"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "h5py==3.12.1",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==6.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
